name: SITF Godot Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "GodotProject/**"
      - ".github/workflows/godot-android.yml"
  push:
    paths:
      - "GodotProject/**"
      - ".github/workflows/godot-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"

      - name: Download Godot 4.7.2
        run: |
          wget -q 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=linux.64&slug=linux.x86_64.zip' -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&platform=templates&slug=export_templates.tpz' -O /tmp/templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Export SITF APK
        working-directory: GodotProject
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Eiq "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-editor.log; then
            echo "Godot script validation failed."
            exit 1
          fi
          timeout 8 godot --headless --path . --quit-after 4 2>&1 | tee /tmp/godot-runtime.log
          if grep -Eiq "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-runtime.log; then
            echo "Godot runtime validation failed."
            exit 1
          fi
          godot --headless --path . --export-debug "Android" build/SITF.apk

      - name: Verify APK
        run: |
          test -s GodotProject/build/SITF.apk
          ls -lh GodotProject/build/SITF.apk
          sha256sum GodotProject/build/SITF.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SITF-Godot-Android-APK
          path: GodotProject/build/SITF.apk
          if-no-files-found: error
          retention-days: 14
