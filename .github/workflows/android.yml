name: Build SITF Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Export SITF APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          use_preset_export_path: true
          export_debug: true
          cache: true
          verbose: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SITF-Android-APK
          path: build/*.apk
          if-no-files-found: error
